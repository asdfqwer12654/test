<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            width: 100%;
            height: 300px;
        }
        #header-top {
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .header-left-group {
            display: flex;
            align-items: center;
            gap: 30px; /* 요소들 사이의 간격 */
        }
        #logodiv{
            display: flex;
            align-items: center;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        .title a{
            text-decoration: none;
            color: black;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        nav ul li a {
            text-decoration: none;
            color: black;
            font-weight: 500;
        }
        
        #logindiv{
            padding: 5px 10px;
        }
        #logindiv a {
            text-decoration: none;
            color: black;
        }
        #header-bottom{
            width: 100%;
            height: 230px;
            overflow: hidden;
        }
        #header-bottom img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        main{
            height: 500px;
            border: 1px solid black;
            display: flex;
            justify-content: space-around; 
            align-items: center;
            padding: 0 50px; /* 양옆 여백 */
            background-color: #f8fafc;
        }
        
        .feature-card {
            width: 28%;
            height: 350px;
            border: 1px solid brown;
            background-color: #fff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            cursor: pointer;
        }
        
        .feature-card h3 {
            font-size: 24px;
            color: #1a202c;
        }
        
        .feature-card .go-btn {
            padding: 10px 20px;
            background-color: #3182ce;
            color: white;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        footer {
            clear: both;
            width: 100%;
            height: 150px;
            border-top: 1px solid #e2e8f0;
            background-color: #f8fafc; 
            font-size: 13px;
            line-height: 1.6;
            padding: 25px 40px;
        }

        .footer-links a {
            color: black; 
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-info p {
            color: black;
        }
        .footer-info span {
            margin-right: 15px;
            display: inline-block;
        }

        .copyright {
            margin-top: 10px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>
    <header>
        <div id="header-top">
            <div class="header-left-group">
                <div id="logodiv">
                    <img src="img/logo.png" alt="로고">
                </div>
                <div class="title"><a href="mainPage.html">타임매니지먼트</a></div>
                <nav>
                    <ul>
                        <li><a href="#none">소개</a></li>
                        <li><a href="#none">주요 기능</a></li>
                        <li><a href="#none">요금제</a></li>
                        <li><a href="#none">고객지원</a></li>
                    </ul>
                </nav>
            </div>
            
            <div id="logindiv">
                <a href="login.html">로그인</a> | <a href="signup.html">회원가입</a>
            </div>
        </div>

       <div id="header-bottom">
            <img src="img/banner.jpg" alt="">
        </div>
    </header>

    <main>
        <div class="feature-card" onclick="location.href='grade.html'">
            <h3>학점 계산기</h3>
            <div class="go-btn">바로가기</div>
        </div>
        
        <div class="feature-card" onclick="location.href='timetable.html'">
            <h3>시간표 만들기</h3>
            <div class="go-btn">바로가기</div>
        </div>
        
        <div class="feature-card" onclick="location.href='schedule.html'">
            <h3>일정 관리</h3>
            <div class="go-btn">바로가기</div>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="#none">회사소개</a>
            <a href="#none">개인정보처리방침</a>
            <a href="#none">이용약관</a>
            <a href="#none">고객센터</a>
        </div>
        
        <div class="footer-info">
            <p>
                <span><strong>(주) 타임매니지먼트</strong></span>
                <span>대표자: 홍길동</span>
                <span>사업자등록번호: 123-456-7890</span>
            </p>
            <p>
                <span>주소: 인천광역시 남동구 미래로 123</span>
                <span>이메일: support@timemanager.com</span>
            </p>
        </div>
        
        <div class="copyright">
            © 2026 TimeManager Inc. All rights reserved.
        </div>
    </footer>
</body>
</html>
