<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            width: 100%;
            height: 70px;
        }
        #header-top {
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .header-left-group {
            display: flex;
            align-items: center;
            gap: 30px; /* 요소들 사이의 간격 */
        }
        #logodiv{
            display: flex;
            align-items: center;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        .title a{
            text-decoration: none;
            color: black;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        nav ul li a {
            text-decoration: none;
            color: black;
            font-weight: 500;
        }
        
        #logindiv{
            padding: 5px 10px;
        }
        #logindiv a {
            text-decoration: none;
            color: black;
        }

        main {
            min-height: 500px;
            padding: 50px;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: auto;
        }
.task-box {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
}

.input-box {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.input-box input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.input-box input[type="text"] {
    flex: 1;
}

.add-btn {
    padding: 10px 20px;
    cursor: pointer;
}

.task-table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
}

.task-table th, 
.task-table td {
    padding: 15px;
    border-bottom: 1px solid #eee;
}

.task-table thead {
    background-color: #f8f9fa;
}
        footer {
            clear: both;
            width: 100%;
            height: 150px;
            border-top: 1px solid #e2e8f0;
            background-color: #f8fafc; 
            font-size: 13px;
            line-height: 1.6;
            padding: 25px 40px;
        }

        .footer-links a {
            color: black; 
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-info p {
            color: black;
        }
        .footer-info span {
            margin-right: 15px;
            display: inline-block;
        }

        .copyright {
            margin-top: 10px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>
    <header>
        <div id="header-top">
            <div class="header-left-group">
                <div id="logodiv">
                    <img src="img/logo.png" alt="로고">
                </div>
                <div class="title"><a href="mainPage.html">타임매니지먼트</a></div>
                <nav>
                    <ul>
                        <li><a href="#none">소개</a></li>
                        <li><a href="#none">주요 기능</a></li>
                        <li><a href="#none">요금제</a></li>
                        <li><a href="#none">고객지원</a></li>
                    </ul>
                </nav>
            </div>
            
            <div id="logindiv">
                <a href="login.html">로그인</a> | <a href="signup.html">회원가입</a>
            </div>
        </div>
    </header>

<main>
    <div class="task-box">
        <h2>과제 일정관리</h2>

        <div class="input-box">
            <input type="text" placeholder="과제명">
            <input type="date">
            <button class="add-btn">일정 추가</button>
        </div>

        <div class="list-box">
            <table class="task-table">
                <thead>
                    <tr>
                        <th>마감일</th>
                        <th>과제명</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2026-06-30</td>
                        <td>데이터베이스 설계 프로젝트</td>
                        <td>진행중</td>
                        <td><button>완료</button> <button>삭제</button></td>
                    </tr>
                    <tr>
                        <td>2026-07-05</td>
                        <td>웹프로그래밍 중간고사</td>
                        <td>진행중</td>
                        <td><button>완료</button> <button>삭제</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

    <footer>
        <div class="footer-links">
            <a href="#none">회사소개</a>
            <a href="#none">개인정보처리방침</a>
            <a href="#none">이용약관</a>
            <a href="#none">고객센터</a>
        </div>
        
        <div class="footer-info">
            <p>
                <span><strong>(주) 타임매니지먼트</strong></span>
                <span>대표자: 홍길동</span>
                <span>사업자등록번호: 123-456-7890</span>
            </p>
            <p>
                <span>주소: 인천광역시 남동구 미래로 123</span>
                <span>이메일: support@timemanager.com</span>
            </p>
        </div>
        
        <div class="copyright">
            © 2026 TimeManager Inc. All rights reserved.
        </div>
    </footer>
</body>
</html>
