<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            width: 100%;
            height: 70px;
        }
        #header-top {
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .header-left-group {
            display: flex;
            align-items: center;
            gap: 30px; /* 요소들 사이의 간격 */
        }
        #logodiv{
            display: flex;
            align-items: center;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        .title a{
            text-decoration: none;
            color: black;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        nav ul li a {
            text-decoration: none;
            color: black;
            font-weight: 500;
        }
        
        #logindiv{
            padding: 5px 10px;
        }
        #logindiv a {
            text-decoration: none;
            color: black;
        }

        main {
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8fafc;
        }
       .mypage-box {
            padding: 30px;
            border: 1px solid #ccc;
            width: 320px;
            text-align: center;
        }
        .mypage-box h2 {
            margin-bottom: 20px;
        }
        .info-group {
            text-align: left;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .info-group p { 
            margin: 5px 0;
            color: #555;
        }
        .mypage-box input {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }
        .mypage-box button {
            width: 100%; 
            padding: 10px; 
            margin-top: 10px; 
            cursor: pointer; 
        }
        .mypage-box a{
            text-decoration: none;
            color: black;
        }
        footer {
            clear: both;
            width: 100%;
            height: 150px;
            border-top: 1px solid #e2e8f0;
            background-color: #f8fafc; 
            font-size: 13px;
            line-height: 1.6;
            padding: 25px 40px;
        }

        .footer-links a {
            color: black; 
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-info p {
            color: black;
        }
        .footer-info span {
            margin-right: 15px;
            display: inline-block;
        }

        .copyright {
            margin-top: 10px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>
    <header>
        <div id="header-top">
            <div class="header-left-group">
                <div id="logodiv">
                    <img src="img/logo.png" alt="로고">

                <nav>
                    <ul>
                        <li><a href="#none">소개</a></li>
                        <li><a href="#none">주요 기능</a></li>
                        <li><a href="#none">요금제</a></li>
                        <li><a href="#none">고객지원</a></li>
                    </ul>
                </nav>
            </div>
            
            <div id="logindiv">
                <a href="myPage.html">마이페이지</a>
            </div>
        </div>
    </header>

    <main>
        <div class="mypage-box">
            <h2>마이페이지</h2>
    
    <div class="info-group">
        <p><strong>아이디:</strong> user123</p>
        <p><strong>이름:</strong> 홍길동</p>
        <p><strong>이메일:</strong> user@email.com</p>
    </div>

    <input type="password" placeholder="현재 비밀번호">
    <input type="password" placeholder="새 비밀번호">
    <input type="password" placeholder="새 비밀번호 확인">
    
    <button><a href="loginMainPage.html">비밀번호 변경</a></button>
</div>
    </main>

    <footer>

            <a href="#none">회사소개</a>
            <a href="#none">개인정보처리방침</a>
            <a href="#none">이용약관</a>
            <a href="#none">고객센터</a>

        <div class="footer-info">
            <p>
                <span><strong>(주) 타임매니지먼트</strong></span>

                <span>이메일: support@timemanager.com</span>
            </p>
        </div>
        
        <div class="copyright">
            © 2026 TimeManager Inc. All rights reserved.
        </div>
    </footer>
</body>
</html>
